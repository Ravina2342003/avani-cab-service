<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Cab – Avani Cab Service Nashik</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="index.html" class="logo">
            <div class="logo-icon">🚖</div>
            <div class="logo-text">
                <span class="logo-main">AVANI</span>
                <span class="logo-sub">CAB SERVICE · NASHIK</span>
            </div>
        </a>
        <nav class="nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="add_booking.html" class="nav-link active">Book a Cab</a>
            <a href="fetch_all_bookings.html" class="nav-link">My Bookings</a>
            <a href="tel:9665109532" class="nav-cta">📞 9665109532</a>
        </nav>
    </div>
</header>

<div class="page-wrap">
    <div class="page-inner">
        <h1 class="page-title">BOOK A CAB</h1>
        <p class="page-subtitle">Fill in your details — we'll confirm your ride shortly</p>

        <div class="form-card">

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Booking ID</label>
                    <input type="text" id="bookingid" class="form-input" placeholder="e.g. ACS-001">
                </div>
                <div class="form-group">
                    <label class="form-label">Your Name</label>
                    <input type="text" id="name" class="form-input" placeholder="Full name">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Pickup Location</label>
                <input type="text" id="pickup" class="form-input" placeholder="e.g. Nashik CBS, Dwarka Circle...">
            </div>

            <div class="form-group">
                <label class="form-label">Destination</label>
                <input type="text" id="destination" class="form-input" placeholder="e.g. Mumbai, Pune, Shirdi...">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Travel Date</label>
                    <input type="date" id="traveldate" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Cab Type</label>
                    <select id="cabtype" class="form-input form-select">
                        <option value="">Select cab type</option>
                        <option value="Hatchback">Hatchback (Swift, Dzire)</option>
                        <option value="Sedan">Sedan (Honda City)</option>
                        <option value="SUV">SUV (Innova, Ertiga)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Package Price (₹)</label>
                <input type="number" id="price" class="form-input" placeholder="e.g. 2500">
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="phone" class="form-input" placeholder="10-digit mobile number">
            </div>

            <button class="submit-btn" id="savebooking">CONFIRM BOOKING</button>

            <div class="success-msg" id="successMsg"></div>
            <div class="error-msg"   id="errorMsg"></div>

        </div>

        <div style="margin-top:24px;text-align:center;">
            <p style="color:var(--gray);font-size:0.85rem;">Need immediate help?</p>
            <a href="tel:9665109532" class="btn-primary" style="margin-top:12px;display:inline-block;">📞 Call: 9665109532</a>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="footer-inner">
        <div class="footer-logo">🚖 AVANI CAB SERVICE NASHIK</div>
        <p class="footer-text small">© 2026 Avani Cab Service. All rights reserved.</p>
    </div>
</footer>

<!-- ✅ JAVASCRIPT ONLY FOR THIS PAGE -->
<script>
    // Paste your AWS API Gateway URL here after deployment.
    // Leave blank ("") to use local storage for testing.
    var API_ENDPOINT = "";

    var USE_LOCAL = (API_ENDPOINT === "" || API_ENDPOINT === "PASTE_YOUR_API_GATEWAY_URL_HERE");

    function getLocal() {
        return JSON.parse(localStorage.getItem("avani_bookings") || "[]");
    }
    function saveLocal(booking) {
        var all = getLocal();
        all.push(booking);
        localStorage.setItem("avani_bookings", JSON.stringify(all));
    }

    document.getElementById("savebooking").addEventListener("click", function () {

        var bookingid   = document.getElementById("bookingid").value.trim();
        var name        = document.getElementById("name").value.trim();
        var pickup      = document.getElementById("pickup").value.trim();
        var destination = document.getElementById("destination").value.trim();
        var traveldate  = document.getElementById("traveldate").value;
        var cabtype     = document.getElementById("cabtype").value;
        var price       = document.getElementById("price").value.trim();
        var phone       = document.getElementById("phone").value.trim();

        var successMsg = document.getElementById("successMsg");
        var errorMsg   = document.getElementById("errorMsg");
        successMsg.classList.remove("show");
        errorMsg.classList.remove("show");

        // Validation
        if (!bookingid || !name || !destination || !price) {
            errorMsg.textContent = "❌ Please fill: Booking ID, Name, Destination and Price.";
            errorMsg.classList.add("show");
            return;
        }

        var btn = document.getElementById("savebooking");
        btn.disabled = true;
        btn.textContent = "SAVING...";

        var data = {
            bookingid:   bookingid,
            name:        name,
            pickup:      pickup,
            destination: destination,
            traveldate:  traveldate,
            cabtype:     cabtype,
            price:       price,
            phone:       phone,
            createdAt:   new Date().toISOString()
        };

        if (USE_LOCAL) {
            saveLocal(data);
            successMsg.textContent = "✅ Booking saved! ID: " + bookingid;
            successMsg.classList.add("show");
            btn.disabled = false;
            btn.textContent = "CONFIRM BOOKING";
            // Clear all fields
            ["bookingid","name","pickup","destination","traveldate","cabtype","price","phone"]
                .forEach(function(id){ document.getElementById(id).value = ""; });
        } else {
            fetch(API_ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(function(r){ return r.json(); })
            .then(function(){
                successMsg.textContent = "✅ Booking confirmed! ID: " + bookingid;
                successMsg.classList.add("show");
                btn.disabled = false;
                btn.textContent = "CONFIRM BOOKING";
                ["bookingid","name","pickup","destination","traveldate","cabtype","price","phone"]
                    .forEach(function(id){ document.getElementById(id).value = ""; });
            })
            .catch(function(err){
                errorMsg.textContent = "❌ Failed: " + err.message;
                errorMsg.classList.add("show");
                btn.disabled = false;
                btn.textContent = "CONFIRM BOOKING";
            });
        }
    });
</script>

</body>
</html>
